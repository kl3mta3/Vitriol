<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vitriol logo — original transmutation-circle composition.

  Structural elements (all generic alchemical / geometric vocabulary):
    - Three concentric outer rings (heavy + thin + medium)
    - Cardinal rune marks (T-shapes at N/S/E/W) on the outer ring
    - Hexagon inscribed inside the third ring
    - Hexagram (Star of David) inscribed inside the hexagon
    - Three media-category icon discs at the up-triangle's outer points
      (music = audio, document = text, picture = image)
    - Inner ring + center diamond + filled core

  This design uses public-domain geometric and alchemical motifs; it is not
  a replica of any copyrighted property.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
  </defs>

  <g stroke="url(#lineGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Three concentric outer rings -->
    <circle cx="256" cy="256" r="248" stroke-width="3"/>
    <circle cx="256" cy="256" r="234" stroke-width="1.2"/>
    <circle cx="256" cy="256" r="200" stroke-width="1.6"/>

    <!-- Cardinal T-runes between the outer two rings -->
    <g stroke-width="2">
      <!-- North -->
      <g transform="translate(256, 218)">
        <line x1="-12" y1="-12" x2="12" y2="-12"/>
        <line x1="0" y1="-12" x2="0" y2="6"/>
      </g>
      <!-- South -->
      <g transform="translate(256, 294)">
        <line x1="-12" y1="12" x2="12" y2="12"/>
        <line x1="0" y1="12" x2="0" y2="-6"/>
      </g>
      <!-- East -->
      <g transform="translate(294, 256) rotate(90)">
        <line x1="-12" y1="-12" x2="12" y2="-12"/>
        <line x1="0" y1="-12" x2="0" y2="6"/>
      </g>
      <!-- West -->
      <g transform="translate(218, 256) rotate(-90)">
        <line x1="-12" y1="-12" x2="12" y2="-12"/>
        <line x1="0" y1="-12" x2="0" y2="6"/>
      </g>
    </g>
    <!-- Tick marks just inside the heavy outer ring at 30° intervals -->
    <g stroke-width="1.4">
      <line x1="500" y1="256" x2="486" y2="256"/>
      <line x1="467.32" y1="135.0" x2="455.20" y2="142.0"/>
      <line x1="377.0" y1="44.68" x2="370.0" y2="56.80"/>
      <line x1="256" y1="12" x2="256" y2="26"/>
      <line x1="135.0" y1="44.68" x2="142.0" y2="56.80"/>
      <line x1="44.68" y1="135.0" x2="56.80" y2="142.0"/>
      <line x1="12" y1="256" x2="26" y2="256"/>
      <line x1="44.68" y1="377.0" x2="56.80" y2="370.0"/>
      <line x1="135.0" y1="467.32" x2="142.0" y2="455.20"/>
      <line x1="256" y1="500" x2="256" y2="486"/>
      <line x1="377.0" y1="467.32" x2="370.0" y2="455.20"/>
      <line x1="467.32" y1="377.0" x2="455.20" y2="370.0"/>
    </g>

    <!-- Hexagon inscribed in radius 200, point-up orientation -->
    <polygon points="429.2,156 256,56 82.8,156 82.8,356 256,456 429.2,356" stroke-width="1.8"/>

    <!-- Hexagram (Star of David) inscribed in the hexagon -->
    <!-- Up-triangle: apex points at top, bottom-left, bottom-right -->
    <polygon points="256,56 82.8,356 429.2,356" stroke-width="1.6"/>
    <!-- Down-triangle: apex points at top-left, top-right, bottom -->
    <polygon points="429.2,156 82.8,156 256,456" stroke-width="1.6"/>

    <!-- Inner ring around center -->
    <circle cx="256" cy="256" r="58" stroke-width="1.4"/>
    <!-- Inner diamond inscribed in inner ring -->
    <polygon points="256,200 312,256 256,312 200,256" stroke-width="1.3"/>

    <!-- Three media-category icon discs at the up-triangle's outer points.
         Each disc is positioned 70% of the way from center toward the
         corresponding triangle apex, with a dark fill so the hexagram
         lines underneath don't bleed through. -->

    <!-- TOP: audio (music note) — at angle 90°, radius 140 -->
    <g>
      <circle cx="256" cy="116" r="32" stroke-width="1.6" fill="#0a0a0f"/>
      <g transform="translate(256, 116)" stroke-width="1.6">
        <!-- Eighth note: head (filled tilted ellipse) + stem + flag -->
        <ellipse cx="-3" cy="7" rx="6" ry="4" transform="rotate(-22 -3 7)" fill="url(#lineGrad)" stroke="none"/>
        <line x1="2.5" y1="4.5" x2="2.5" y2="-13"/>
        <path d="M2.5,-13 Q12,-9 8,0" fill="none"/>
      </g>
    </g>

    <!-- BOTTOM-LEFT: text (document with lines) — angle 210°, radius 140 -->
    <g>
      <circle cx="134.76" cy="326" r="32" stroke-width="1.6" fill="#0a0a0f"/>
      <g transform="translate(134.76, 326)" stroke-width="1.4">
        <!-- Document outline with folded corner -->
        <path d="M-12,-14 L6,-14 L13,-7 L13,14 L-12,14 Z" fill="none"/>
        <path d="M6,-14 L6,-7 L13,-7" fill="none"/>
        <!-- Body lines -->
        <line x1="-8" y1="-2" x2="8" y2="-2"/>
        <line x1="-8" y1="3" x2="8" y2="3"/>
        <line x1="-8" y1="8" x2="4" y2="8"/>
      </g>
    </g>

    <!-- BOTTOM-RIGHT: image (sun + mountain in frame) — angle 330°, radius 140 -->
    <g>
      <circle cx="377.24" cy="326" r="32" stroke-width="1.6" fill="#0a0a0f"/>
      <g transform="translate(377.24, 326)" stroke-width="1.4">
        <rect x="-15" y="-13" width="30" height="26" rx="2" fill="none"/>
        <!-- Sun -->
        <circle cx="-6" cy="-5" r="3.2" fill="url(#lineGrad)" stroke="none"/>
        <!-- Mountain ridge -->
        <polyline points="-15,11 -7,2 -1,8 6,-1 15,11" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Center filled core (gradient glow) -->
  <circle cx="256" cy="256" r="6" fill="url(#centerGlow)"/>
</svg>
